<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LegalEase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>

  <div class="app">

    <!-- ── HEADER ── -->
    <header class="header">
      <div class="header-left">
        <span class="logo-mark">⚖</span>
        <span class="logo-name">LegalEase</span>
      </div>

      <div class="header-center">
        <div class="mode-bar" id="modeBar">
          <button class="mode-btn active" data-mode="general">Q&amp;A</button>
          <button class="mode-btn" data-mode="risk">Risk</button>
          <button class="mode-btn" data-mode="missing">Missing</button>
          <button class="mode-btn" data-mode="compare">Compare</button>
          <button class="mode-btn" data-mode="simplify">Simplify</button>
          <button class="mode-btn" data-mode="ipc">IPC</button>
          <button class="mode-btn" data-mode="draft">Draft</button>
          <button class="mode-btn" data-mode="summarise">Summarise</button>
        </div>
      </div>

      <div class="header-right">
        <button class="hdr-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
          <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="hdr-btn" id="clearBtn" title="Clear session" aria-label="Clear session">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ── MAIN ── -->
    <main class="main" id="main">

      <!-- Pipeline bar (shown only while processing) -->
      <div class="pipeline-bar" id="pipelineBar" hidden>
        <div class="pipeline-step" data-step="ingest">Ingest</div>
        <div class="pipeline-sep">›</div>
        <div class="pipeline-step" data-step="chunk">Chunk</div>
        <div class="pipeline-sep">›</div>
        <div class="pipeline-step" data-step="embed">Embed</div>
        <div class="pipeline-sep">›</div>
        <div class="pipeline-step" data-step="prompt">Prompt</div>
        <div class="pipeline-sep">›</div>
        <div class="pipeline-step" data-step="gemini">Gemini</div>
        <div class="pipeline-sep">›</div>
        <div class="pipeline-step" data-step="parse">Parse</div>
      </div>

      <!-- Empty state -->
      <div class="empty-state" id="emptyState">
        <div class="empty-mark">⚖</div>
        <h1 class="empty-title">LegalEase</h1>
        <p class="empty-sub">AI-powered Indian legal document intelligence</p>
        <p class="empty-privacy">🔒 Documents are processed in-memory only — nothing is stored</p>
        <div class="chips" id="suggestionChips">
          <button class="chip" data-query="What are my rights as a tenant under the Model Tenancy Act?">Tenant rights — Model Tenancy Act</button>
          <button class="chip" data-query="Explain Section 420 IPC and its punishment">Section 420 IPC</button>
          <button class="chip" data-query="What clauses should every NDA include under Indian law?">Essential NDA clauses</button>
          <button class="chip" data-query="How can I legally terminate an employment contract in India?">Employment contract termination</button>
          <button class="chip" data-query="Consumer complaint process under Consumer Protection Act 2019">Consumer Protection Act 2019</button>
          <button class="chip" data-query="Draft a rental agreement clause for security deposit">Draft security deposit clause</button>
        </div>
      </div>

      <!-- Messages -->
      <div class="messages" id="messages"></div>

    </main>

    <!-- ── INPUT ── -->
    <footer class="input-area">
      <div class="attached-row" id="attachedRow"></div>
      <div class="input-row">
        <button class="input-btn" id="attachBtn" title="Attach document" aria-label="Attach document">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <input type="file" id="fileInput" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.wav,.mp3" hidden aria-hidden="true" />
        <textarea
          id="messageInput"
          placeholder="Ask about any Indian law, or upload a document…"
          rows="1"
          aria-label="Message input"
        ></textarea>
        <button class="input-btn mic-btn" id="micBtn" title="Voice query" aria-label="Voice query">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <button class="send-btn" id="sendBtn" aria-label="Send message">
          <svg id="sendIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-footer">
        <span id="statusText">Ready</span>
        <span id="clauseCount" style="display:none"></span>
      </div>
    </footer>

  </div>

  <script src="js/storage.js"></script>
  <script src="js/modes.js"></script>
  <script src="js/pipeline.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
